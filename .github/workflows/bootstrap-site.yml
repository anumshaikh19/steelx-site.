name: Bootstrap site from archive

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract site
        shell: bash
        run: |
          set -euo pipefail
          test -f steelx-site.zip
          rm -rf /tmp/steelx-site
          mkdir -p /tmp/steelx-site
          unzip -q steelx-site.zip -d /tmp/steelx-site
          rm -rf /tmp/steelx-site/.git
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='dist-ssr/' \
            --exclude='.output/' \
            --exclude='.vinxi/' \
            --exclude='.nitro/' \
            --exclude='tsconfig.tsbuildinfo' \
            /tmp/steelx-site/ ./
          rm -f steelx-site.zip
          rm -f .github/workflows/bootstrap-site.yml
          rm -f BOOTSTRAP_TRIGGER.txt
          touch .env.example
          grep -qxF '.env' .gitignore || printf '\n# Local environment files\n.env\n.env.*\n!.env.example\n' >> .gitignore

      - name: Commit extracted application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: extract application source for Vercel deployment'
          git push
